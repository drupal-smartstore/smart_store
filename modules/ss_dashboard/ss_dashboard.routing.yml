ss_dashboard.admin_config:
  path: "/admin/config/smart_store"
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: "Smart Store"
  requirements:
    _permission: "administer site configuration"

ss_dashboard.earnings_settings:
  path: "/admin/config/smart_store/dashboard/earnings-settings"
  defaults:
    _form: '\Drupal\ss_dashboard\Form\EarningsSettingsForm'
    _title: "Earnings Settings"
  requirements:
    _permission: "administer site configuration"
