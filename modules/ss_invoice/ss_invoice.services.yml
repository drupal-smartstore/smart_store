services:
  ss_invoice.invoice_service:
    class: Drupal\ss_invoice\Service\InvoiceService
    arguments:
      - "@database"
      - "@current_user"
      - "@commerce_store.current_store"
      - "@address.subdivision_repository"
      - "@entity_type.manager"
      - "@datetime.time"
      - "@logger.factory"

  ss_invoice.twig_extension:
    class: Drupal\ss_invoice\SsInvoiceTwigExtension
    arguments:
      - "@current_user"
    tags:
      - { name: twig.extension }
